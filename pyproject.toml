[project]
name = "devis-lab"
version = "0.1.0"
description = "Lab IA-natif LMFR — feature de simulation devis-pose"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devis"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "eval: test eval dérivé de spec.md §7 — merge gate (make evals)",
]
