[project]
name = "devis-lab"
version = "0.1.0"
description = "AI-Native Lab — quote-simulation feature (devis-pose)"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devis"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "eval: Tier-1 eval derived from spec.md §7.1 — offline merge gate (just evals), fakes only",
    "integration: Tier-2 check against a container/emulator (Postgres, Keycloak, …) — just integration, run separately from the offline gate",
    "live: Tier-2 check against a real service (creds/cost — Vertex, OAuth, staging) — just live, refuses without LIVE=1",
]
