# Proxy d'egress du sandbox : n'autorise QUE les domaines du filtre (allowlist stricte).
# Le conteneur sandbox tourne sur un réseau Docker `--internal` (aucun accès sortant direct) et
# ne joint l'extérieur QUE via ce proxy → seul anthropic.com est atteignable (API claude).
Port 8888
Listen 0.0.0.0
Timeout 600
User tinyproxy
Group tinyproxy

# Allowlist : refus par défaut, on ne laisse passer que ce qui matche sandbox/filter (regex étendue).
Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Yes
FilterExtended On
FilterURLs Off

# CONNECT (HTTPS) restreint aux ports TLS standard
ConnectPort 443
ConnectPort 563

# ACL clients : le réseau Docker interne est déjà isolé → on autorise les clients du proxy
Allow 0.0.0.0/0
MaxClients 50
LogLevel Info
